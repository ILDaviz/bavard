name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'utility/documentation/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: utility/documentation/yarn.lock

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: ./utility/documentation
        run: yarn install --immutable

      - name: Build with VitePress
        working-directory: ./utility/documentation
        run: yarn run docs:build

      - name: Debug Build Output
        run: ls -R utility/documentation/.vitepress/dist

      - name: Remove .gitignore to allow upload
        run: rm utility/documentation/.gitignore

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: utility/documentation/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4